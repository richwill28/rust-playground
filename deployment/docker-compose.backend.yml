services:
  playground-backend:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: playground-backend
    restart: unless-stopped
    env_file:
      - ../.env.backend
    environment:
      PLAYGROUND_UI_ADDRESS: 0.0.0.0
      PLAYGROUND_UI_PORT: 3000
      PLAYGROUND_UI_ROOT: /app/ui/frontend/build
      TMPDIR: /playground-tmp
    ports:
      - "3000:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - playground-tmp:/playground-tmp
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

volumes:
  playground-tmp:
